<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>البحث العكسي عن الصور v2 - أبو نواف</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; }
    .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 40px; text-align: center; }
    .logo { width: 80px; height: 80px; margin: 0 auto 20px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
    h1 { font-size: 2.5em; margin-bottom: 10px; }
    .content { padding: 40px; }
    .input-group { margin-bottom: 30px; }
    label { display: block; margin-bottom: 10px; font-weight: bold; color: #667eea; }
    input { width: 100%; padding: 15px; border: 2px solid #e0e7ff; border-radius: 10px; font-size: 1em; }
    button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; padding: 15px 40px; border-radius: 10px; font-size: 1.1em; font-weight: bold; cursor: pointer; transition: all 0.3s; }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(102,126,234,0.6); }
    .results { margin-top: 30px; display: none; }
    .results.show { display: block; }
    .result-item { background: #f8fafc; padding: 15px; margin-bottom: 10px; border-radius: 10px; border-right: 4px solid #667eea; }
    .result-item a { color: #667eea; text-decoration: none; font-weight: bold; }
    .result-item a:hover { text-decoration: underline; }
    .loading { text-align: center; padding: 40px; display: none; }
    .loading.show { display: block; }
    .spinner { border: 4px solid #f3f4f6; border-top: 4px solid #667eea; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .footer { background: #1e293b; color: white; padding: 30px; text-align: center; }
    .badge { display: inline-block; background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.85em; margin: 5px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
    .stat { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; border-radius: 10px; text-align: center; }
    .stat-number { font-size: 2em; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg width="50" height="50" viewBox="0 0 100 100">
          <path d="M50 5 L90 25 L90 60 Q90 85 50 95 Q10 85 10 60 L10 25 Z" fill="#667eea" stroke="#4f46e5" stroke-width="3"/>
          <text x="50" y="60" font-size="32" font-weight="bold" fill="white" text-anchor="middle">AN</text>
        </svg>
      </div>
      <h1>🔍 البحث العكسي عن الصور v2</h1>
      <p>ابحث عن مصادر الصور على الإنترنت</p>
    </div>
    
    <div class="content">
      <div class="input-group">
        <label>رابط الصورة</label>
        <input type="url" id="imageUrl" placeholder="https://example.com/image.jpg" />
      </div>
      
      <button onclick="search()" id="searchBtn">🔍 بحث عكسي</button>
      
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>جاري البحث في مصادر متعددة...</p>
      </div>
      
      <div class="results" id="results"></div>
    </div>
    
    <div class="footer">
      <div style="display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:20px;">
        <svg width="50" height="50" viewBox="0 0 100 100">
          <path d="M50 5 L90 25 L90 60 Q90 85 50 95 Q10 85 10 60 L10 25 Z" fill="#667eea"/>
          <text x="50" y="60" font-size="32" font-weight="bold" fill="white" text-anchor="middle">AN</text>
        </svg>
        <div>
          <div style="font-size:1.2em;font-weight:bold;">أبو نواف - هكر أخلاقي</div>
          <div style="color:#94a3b8;">أدوات OSINT متقدمة</div>
        </div>
      </div>
      <span class="badge">🛡️ هكر أخلاقي</span>
      <span class="badge">🔒 آمن</span>
      <span class="badge">⚡ متقدم</span>
    </div>
  </div>
  
  <script>
    async function search() {
      const imageUrl = document.getElementById('imageUrl').value.trim();
      if (!imageUrl) { alert('الرجاء إدخال رابط الصورة'); return; }
      
      const btn = document.getElementById('searchBtn');
      const loading = document.getElementById('loading');
      const results = document.getElementById('results');
      
      btn.disabled = true;
      loading.classList.add('show');
      results.classList.remove('show');
      
      try {
        const response = await fetch('/api/reverse?imageUrl=' + encodeURIComponent(imageUrl));
        const data = await response.json();
        
        let html = '<div class="stats">';
        html += '<div class="stat"><div class="stat-number">' + data.total + '</div><div>نتيجة</div></div>';
        html += '<div class="stat"><div class="stat-number">' + (data.sources?.google || 0) + '</div><div>Google</div></div>';
        html += '<div class="stat"><div class="stat-number">' + (data.sources?.yandex || 0) + '</div><div>Yandex</div></div>';
        html += '<div class="stat"><div class="stat-number">' + (data.sources?.bing || 0) + '</div><div>Bing</div></div>';
        html += '</div>';
        
        if (data.results && data.results.length > 0) {
          html += '<h3 style="margin:20px 0;">النتائج:</h3>';
          data.results.forEach(r => {
            html += '<div class="result-item">';
            html += '<a href="' + r.url + '" target="_blank">' + (r.title || r.url) + '</a>';
            html += '<div style="margin-top:5px;color:#64748b;font-size:0.9em;">';
            html += 'المصدر: ' + (r.source || 'غير معروف');
            if (r.confidence) html += ' | الثقة: ' + Math.round(r.confidence * 100) + '%';
            html += '</div></div>';
          });
        } else {
          html += '<p style="text-align:center;padding:20px;color:#64748b;">لم يتم العثور على نتائج</p>';
        }
        
        results.innerHTML = html;
        results.classList.add('show');
      } catch (err) {
        alert('حدث خطأ: ' + err.message);
      } finally {
        btn.disabled = false;
        loading.classList.remove('show');
      }
    }
  </script>
</body>
</html>
